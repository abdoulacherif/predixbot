<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement FlinPay</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:400px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#1e3a8a;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    background:#2563eb;
    color:#fff;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#1d4ed8;
}

#result{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<h2>Payer avec FlinPay</h2>

<input type="text" id="name" placeholder="Nom du client">

<input type="text" id="phone" placeholder="Téléphone">

<input type="number" id="amount" placeholder="Montant">

<select id="country">
<option value="CM">Cameroun</option>
<option value="CI">Côte d'Ivoire</option>
<option value="SN">Sénégal</option>
<option value="BJ">Bénin</option>
<option value="TG">Togo</option>
</select>

<button onclick="payer()">
Payer
</button>

<div id="result"></div>

</div>

<script>

async function payer(){

const res=document.getElementById("result");

res.innerHTML="Paiement en cours...";

const response=await fetch("https://flinpay.vercel.app/api/pay",{

method:"POST",

headers:{
"Authorization":"Bearer fp_live_604114deefebf6bd57ee33acf852e2af7a16e841fe9edeea",
"Content-Type":"application/json"
},

body:JSON.stringify({

amount:Number(document.getElementById("amount").value),

phone:document.getElementById("phone").value,

client_name:document.getElementById("name").value,

order_id:"ORD-"+Date.now(),

country:document.getElementById("country").value

})

});

const data=await response.json();

console.log(data);

if(response.ok){

res.innerHTML="✅ Paiement créé avec succès";

console.log(data);

}else{

res.innerHTML="❌ "+(data.message||"Erreur");

}

}

</script>

</body>
</html>
