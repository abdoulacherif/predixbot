<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paiement Flinpay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b1a33, #142d4b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: 0.3s;
        }
        .card h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1a33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card .sub {
            color: #6b7a8f;
            font-size: 14px;
            margin-bottom: 28px;
            border-bottom: 1px solid #eef2f7;
            padding-bottom: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #1e2f4a;
            display: block;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            background: #f9fafc;
            transition: 0.25s;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        .inline-group {
            display: flex;
            gap: 14px;
        }
        .inline-group .form-group {
            flex: 1;
        }
        .btn-pay {
            background: #1a3d6b;
            color: white;
            font-size: 20px;
            font-weight: 700;
            padding: 18px;
            border: none;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .btn-pay:hover {
            background: #0f2b4a;
            transform: scale(1.01);
            box-shadow: 0 10px 28px rgba(26, 61, 107, 0.4);
        }
        .btn-pay:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #responseMsg {
            margin-top: 22px;
            padding: 16px 18px;
            border-radius: 16px;
            display: none;
            font-weight: 500;
            background: #f1f5f9;
            color: #1e2f4a;
            border-left: 6px solid #2563eb;
            word-break: break-word;
        }
        #responseMsg.success {
            border-left-color: #16a34a;
            background: #ecfdf5;
            color: #14532d;
        }
        #responseMsg.error {
            border-left-color: #dc2626;
            background: #fef2f2;
            color: #7f1d1d;
        }
        .badge {
            font-size: 12px;
            background: #eef2f7;
            padding: 4px 12px;
            border-radius: 40px;
            color: #1e3a6b;
            font-weight: 500;
        }
        .footer-note {
            margin-top: 18px;
            font-size: 13px;
            color: #7a8aa0;
            text-align: center;
        }
        .footer-note strong {
            color: #1e3a6b;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>
        💳 Paiement
        <span class="badge">Sécurisé</span>
    </h1>
    <div class="sub">Transaction instantanée via Mobile Money</div>

    <form id="paymentForm">
        <!-- Montant -->
        <div class="form-group">
            <label>💰 Montant (FCFA)</label>
            <input type="number" id="amount" value="1000" min="100" step="100" required />
        </div>

        <!-- Téléphone & Opérateur -->
        <div class="inline-group">
            <div class="form-group">
                <label>📱 Téléphone</label>
                <input type="tel" id="phone" value="0700000000" placeholder="0700000000" required />
            </div>
            <div class="form-group">
                <label>📶 Opérateur</label>
                <select id="operator">
                    <option value="momo">MTN MoMo</option>
                    <option value="om">Orange Money</option>
                </select>
            </div>
        </div>

        <!-- Nom client -->
        <div class="form-group">
            <label>👤 Nom complet</label>
            <input type="text" id="client_name" value="Kouamé Diallo" placeholder="Nom du client" required />
        </div>

        <!-- Référence commande -->
        <div class="form-group">
            <label>📦 Référence commande</label>
            <input type="text" id="order_id" value="ORD-001" placeholder="ex: ORD-123" required />
        </div>

        <!-- Pays (fixe CI) -->
        <input type="hidden" id="country" value="CI" />

        <button type="submit" class="btn-pay" id="payBtn">
            <span id="btnText">⚡ Payer maintenant</span>
            <span class="loader" id="loader"></span>
        </button>
    </form>

    <div id="responseMsg"></div>
    <div class="footer-note">
        <strong>🔒</strong> Paiement sécurisé · Confirmation SMS directe
    </div>
</div>

<script>
    (function() {
        // ---------- VOTRE CLÉ API ----------
        const API_KEY = "fp_live_2ae257e679151358f45840531d5e27d3cddc578bfe855e92";
        const BASE_URL = "https://www.flinpay.cfd";

        const form = document.getElementById('paymentForm');
        const payBtn = document.getElementById('payBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const responseMsg = document.getElementById('responseMsg');

        // Fonction pour afficher le message de réponse
        function showMessage(message, type = 'info') {
            responseMsg.style.display = 'block';
            responseMsg.textContent = message;
            responseMsg.className = ''; // reset
            if (type === 'success') {
                responseMsg.classList.add('success');
            } else if (type === 'error') {
                responseMsg.classList.add('error');
            } else {
                // info par défaut
                responseMsg.style.borderLeftColor = '#2563eb';
                responseMsg.style.background = '#f1f5f9';
                responseMsg.style.color = '#1e2f4a';
            }
        }

        // Réinitialiser le bouton
        function resetButton() {
            payBtn.disabled = false;
            btnText.style.display = 'inline';
            loader.style.display = 'none';
        }

        // Mettre le bouton en état de chargement
        function setLoading() {
            payBtn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'inline-block';
        }

        // Gestion du formulaire
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            // Cacher l'ancien message
            responseMsg.style.display = 'none';

            // Récupération des valeurs
            const amount = parseInt(document.getElementById('amount').value.trim());
            const phone = document.getElementById('phone').value.trim();
            const client_name = document.getElementById('client_name').value.trim();
            const order_id = document.getElementById('order_id').value.trim();
            const operator = document.getElementById('operator').value;
            const country = document.getElementById('country').value;

            // Validations simples
            if (!amount || amount < 100) {
                showMessage('⚠️ Le montant doit être d\'au moins 100 FCFA.', 'error');
                return;
            }
            if (!phone || phone.length < 8) {
                showMessage('📞 Numéro de téléphone invalide.', 'error');
                return;
            }
            if (!client_name || client_name.length < 2) {
                showMessage('👤 Veuillez entrer un nom valide.', 'error');
                return;
            }
            if (!order_id || order_id.length < 2) {
                showMessage('📦 Référence de commande requise.', 'error');
                return;
            }

            // Construction du payload
            const payload = {
                amount: amount,
                phone: phone,
                client_name: client_name,
                order_id: order_id,
                country: country,
                operator: operator
            };

            console.log('📤 Envoi de la requête :', payload);

            // Activer le loader
            setLoading();

            try {
                const response = await fetch(`${BASE_URL}/api/pay`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                // Lire la réponse JSON
                const data = await response.json();
                console.log('📥 Réponse Flinpay :', data);

                if (response.ok) {
                    // Succès
                    showMessage(
                        `✅ Paiement initié ! ${data.message || 'Le client recevra une confirmation sur son téléphone.'}\n` +
                        `📌 Réf: ${data.order_id || order_id}`,
                        'success'
                    );
                    // Optionnel : réinitialiser le formulaire ?
                } else {
                    // Erreur HTTP (4xx, 5xx)
                    const errorMsg = data.message || data.error || 'Erreur inconnue du serveur.';
                    showMessage(`❌ ${errorMsg}`, 'error');
                }
            } catch (error) {
                console.error('Erreur réseau :', error);
                showMessage(
                    '🌐 Impossible de contacter le serveur. Vérifiez votre connexion ou réessayez plus tard.',
                    'error'
                );
            } finally {
                resetButton();
            }
        });

        // Option : pré-remplir une référence unique si vide
        if (document.getElementById('order_id').value === '') {
            const genRef = 'ORD-' + Date.now().toString().slice(-6);
            document.getElementById('order_id').value = genRef;
        }

    })();
</script>

</body>
</html>
