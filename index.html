<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flinpay - Paiement Mobile Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 520px;
            width: 100%;
            padding: 40px 35px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
            color: #2d3436;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #b0b0b0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .operator-icons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .operator-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #2d3436;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .operator-badge.mtn {
            background: #fef3e8;
            color: #e67e22;
        }

        .operator-badge.orange {
            background: #fde8e8;
            color: #e74c3c;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.loading .loader {
            display: block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .response-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .response-box.success {
            display: block;
            background: #e8f8f0;
            border: 2px solid #27ae60;
        }

        .response-box.error {
            display: block;
            background: #fde8e8;
            border: 2px solid #e74c3c;
        }

        .response-box .response-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .response-box.success .response-title {
            color: #27ae60;
        }

        .response-box.error .response-title {
            color: #e74c3c;
        }

        .response-box pre {
            background: rgba(0,0,0,0.05);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 8px;
        }

        .security-note {
            margin-top: 20px;
            padding: 14px 16px;
            background: #fff8e1;
            border-radius: 10px;
            border-left: 4px solid #f39c12;
            font-size: 13px;
            color: #7f8c8d;
            line-height: 1.5;
        }

        .security-note strong {
            color: #2d3436;
        }

        .security-note .lock-icon {
            margin-right: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .operator-icons {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>💳 Flinpay</h1>
            <p>Paiement Mobile Money sécurisé</p>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label>Opérateur <span class="required">*</span></label>
                <select id="operator" required>
                    <option value="">Sélectionnez un opérateur</option>
                    <option value="momo">MTN Mobile Money</option>
                    <option value="om">Orange Money</option>
                </select>
                <div class="operator-icons">
                    <span class="operator-badge mtn">📱 MTN MoMo</span>
                    <span class="operator-badge orange">📱 Orange Money</span>
                </div>
            </div>

            <div class="form-group">
                <label>Pays <span class="required">*</span></label>
                <select id="country" required>
                    <option value="">Sélectionnez un pays</option>
                    <option value="CI">Côte d'Ivoire</option>
                    <option value="CM">Cameroun</option>
                    <option value="SN">Sénégal</option>
                    <option value="BF">Burkina Faso</option>
                    <option value="ML">Mali</option>
                    <option value="BJ">Bénin</option>
                    <option value="TG">Togo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Numéro de téléphone <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="0700000000" required>
                <small style="color: #95a5a6; font-size: 12px;">Format sans indicatif pays</small>
            </div>

            <div class="form-group">
                <label>Nom complet du client <span class="required">*</span></label>
                <input type="text" id="clientName" placeholder="Kouamé Diallo" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Montant (FCFA) <span class="required">*</span></label>
                    <input type="number" id="amount" placeholder="10000" min="100" required>
                </div>
                <div class="form-group">
                    <label>Référence commande <span class="required">*</span></label>
                    <input type="text" id="orderId" placeholder="ORD-001" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">💰 Payer maintenant</span>
                <span class="loader"></span>
            </button>
        </form>

        <div id="response" class="response-box"></div>

        <div class="security-note">
            <span class="lock-icon">🔒</span> <strong>Environnement de production</strong> — Les transactions sont réelles.
            Votre clé API reste sécurisée côté serveur.
        </div>
    </div>

    <script>
        // Clé API fournie (production)
        const API_KEY = 'fp_live_a0724e922867c0f331e82b221c5f3dd43e7f7ecaf47d5115';

        // URL de l'API Flinpay
        const API_URL = 'https://www.flinpay.cfd/api/pay';

        // Gestion du formulaire
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const responseDiv = document.getElementById('response');

            // Désactiver le bouton
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            // Cacher l'ancienne réponse
            responseDiv.className = 'response-box';
            responseDiv.innerHTML = '';

            // Récupérer les valeurs
            const operator = document.getElementById('operator').value;
            const country = document.getElementById('country').value;
            const phone = document.getElementById('phone').value.trim();
            const clientName = document.getElementById('clientName').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const orderId = document.getElementById('orderId').value.trim();

            // Validation supplémentaire
            if (!operator || !country || !phone || !clientName || !amount || !orderId) {
                showResponse(false, 'Tous les champs sont obligatoires.');
                resetButton();
                return;
            }

            if (isNaN(amount) || amount < 100) {
                showResponse(false, 'Le montant minimum est de 100 FCFA.');
                resetButton();
                return;
            }

            if (!/^\d{9,12}$/.test(phone.replace(/\s/g, ''))) {
                showResponse(false, 'Numéro de téléphone invalide. Format: 0700000000');
                resetButton();
                return;
            }

            // Construction du payload
            const payload = {
                amount: amount,
                phone: phone,
                client_name: clientName,
                order_id: orderId,
                country: country,
                operator: operator
            };

            console.log('📤 Envoi de la requête:', payload);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                console.log('📥 Réponse:', data);

                if (response.ok && data.ok) {
                    showResponse(true, data, payload);
                } else {
                    const errorMsg = data.error || `Erreur HTTP ${response.status}`;
                    showResponse(false, errorMsg, data);
                }
            } catch (error) {
                console.error('❌ Erreur réseau:', error);
                showResponse(false, 'Erreur de connexion au serveur. Vérifiez votre réseau.');
            } finally {
                resetButton();
            }
        });

        function showResponse(success, data, payload) {
            const responseDiv = document.getElementById('response');
            responseDiv.className = 'response-box ' + (success ? 'success' : 'error');

            if (success) {
                responseDiv.innerHTML = `
                    <div class="response-title">✅ Paiement initié avec succès</div>
                    <p style="color: #2d3436; margin-bottom: 8px; font-size: 14px;">
                        Le client va recevoir une confirmation USSD sur son téléphone.
                    </p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p style="margin-top: 10px; font-size: 13px; color: #27ae60;">
                        💡 Statut: <strong>${data.status || 'pending'}</strong> — En attente de confirmation
                    </p>
                `;
            } else {
                responseDiv.innerHTML = `
                    <div class="response-title">❌ Erreur</div>
                    <p style="color: #2d3436; margin-bottom: 8px; font-size: 14px;">
                        ${typeof data === 'string' ? data : (data.error || 'Une erreur est survenue')}
                    </p>
                    ${typeof data === 'object' ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
                `;
            }

            // Scroll vers la réponse
            responseDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function resetButton() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
        }

        // Générer un order_id par défaut
        document.addEventListener('DOMContentLoaded', function() {
            const orderInput = document.getElementById('orderId');
            if (!orderInput.value) {
                const timestamp = Date.now().toString(36).toUpperCase();
                const random = Math.random().toString(36).substring(2, 6).toUpperCase();
                orderInput.value = `ORD-${timestamp}-${random}`;
            }
        });
    </script>
</body>
</html>
