<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Flinpay</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .payment-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px 35px;
            transition: transform 0.3s ease;
        }

        .payment-card:hover {
            transform: translateY(-5px);
        }

        .payment-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .payment-header i {
            font-size: 48px;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            padding: 20px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .payment-header h1 {
            font-size: 24px;
            color: #2d3748;
            font-weight: 700;
        }

        .payment-header p {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 16px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f7fafc;
            color: #2d3748;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .amount-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
        }

        .amount-display span {
            font-size: 14px;
            opacity: 0.9;
        }

        .amount-display .amount-value {
            font-size: 28px;
            font-weight: 700;
            display: block;
            margin-top: 5px;
        }

        .payment-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .payment-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .payment-btn:active {
            transform: translateY(0);
        }

        .payment-btn i {
            font-size: 20px;
        }

        .payment-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }

        .status-message.success {
            display: block;
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .status-message.error {
            display: block;
            background: #fed7d7;
            color: #9b2c2c;
            border-left: 4px solid #fc8181;
        }

        .status-message .details {
            font-weight: 400;
            margin-top: 5px;
            font-size: 13px;
            opacity: 0.8;
        }

        .footer-note {
            margin-top: 20px;
            text-align: center;
            color: #a0aec0;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .payment-card {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .payment-header h1 {
                font-size: 20px;
            }

            .amount-display .amount-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="payment-card">
    <div class="payment-header">
        <i class="fas fa-credit-card"></i>
        <h1>Paiement sécurisé</h1>
        <p>Effectuez votre paiement en toute sécurité</p>
    </div>

    <form id="paymentForm">
        <!-- Montant -->
        <div class="form-group">
            <label for="amount">Montant (FCFA)</label>
            <div class="input-wrapper">
                <i class="fas fa-money-bill-wave"></i>
                <input type="number" id="amount" placeholder="Ex: 10000" required min="100" step="100">
            </div>
        </div>

        <!-- Téléphone -->
        <div class="form-group">
            <label for="phone">Numéro de téléphone</label>
            <div class="input-wrapper">
                <i class="fas fa-phone"></i>
                <input type="tel" id="phone" placeholder="Ex: 0700000000" required>
            </div>
        </div>

        <!-- Client -->
        <div class="form-group">
            <label for="client_name">Nom du client</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="client_name" placeholder="Ex: Kouamé Diallo" required>
            </div>
        </div>

        <!-- Pays -->
        <div class="form-group">
            <label for="country">Pays</label>
            <div class="input-wrapper">
                <i class="fas fa-globe-africa"></i>
                <select id="country" required>
                    <option value="">Sélectionnez un pays</option>
                    <option value="CI">🇨🇮 Côte d'Ivoire</option>
                    <option value="SN">🇸🇳 Sénégal</option>
                    <option value="CM">🇨🇲 Cameroun</option>
                    <option value="ML">🇲🇱 Mali</option>
                    <option value="BF">🇧🇫 Burkina Faso</option>
                    <option value="BJ">🇧🇯 Bénin</option>
                    <option value="TG">🇹🇬 Togo</option>
                    <option value="GN">🇬🇳 Guinée</option>
                    <option value="CI" selected>🇨🇮 Côte d'Ivoire</option>
                </select>
            </div>
        </div>

        <!-- Affichage montant -->
        <div class="amount-display">
            <span>Montant à payer</span>
            <span class="amount-value" id="displayAmount">0 FCFA</span>
        </div>

        <!-- Bouton -->
        <button type="submit" class="payment-btn" id="payBtn">
            <span id="btnText"><i class="fas fa-lock"></i> Payer maintenant</span>
            <span class="loader" id="btnLoader"></span>
        </button>
    </form>

    <!-- Message de statut -->
    <div id="statusMessage" class="status-message"></div>

    <div class="footer-note">
        <i class="fas fa-shield-alt"></i> Paiement sécurisé via Flinpay
    </div>
</div>

<script>
    const API_KEY = 'fp_test_ec7a263529d0345165f204569fd539895bff4fa249d489e6';
    const BASE_URL = 'https://flinpay.vercel.app';

    const form = document.getElementById('paymentForm');
    const amountInput = document.getElementById('amount');
    const phoneInput = document.getElementById('phone');
    const clientNameInput = document.getElementById('client_name');
    const countrySelect = document.getElementById('country');
    const displayAmount = document.getElementById('displayAmount');
    const payBtn = document.getElementById('payBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const statusMessage = document.getElementById('statusMessage');

    // Mise à jour dynamique du montant affiché
    amountInput.addEventListener('input', () => {
        const val = parseInt(amountInput.value) || 0;
        displayAmount.textContent = val.toLocaleString() + ' FCFA';
    });

    // Génération d'un order_id unique
    function generateOrderId() {
        const date = new Date();
        const timestamp = date.getFullYear() +
            String(date.getMonth() + 1).padStart(2, '0') +
            String(date.getDate()).padStart(2, '0') +
            String(date.getHours()).padStart(2, '0') +
            String(date.getMinutes()).padStart(2, '0') +
            String(date.getSeconds()).padStart(2, '0');
        const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
        return `ORD-${timestamp}-${random}`;
    }

    // Affichage du message de statut
    function showStatus(message, type, details = '') {
        statusMessage.className = `status-message ${type}`;
        statusMessage.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
            ${message}
            ${details ? `<div class="details">${details}</div>` : ''}
        `;
        // Auto-scroll vers le message
        statusMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Réinitialisation du statut
    function clearStatus() {
        statusMessage.className = 'status-message';
        statusMessage.innerHTML = '';
    }

    // Gestion de la soumission du formulaire
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearStatus();

        // Récupération et validation des données
        const amount = parseInt(amountInput.value);
        const phone = phoneInput.value.trim();
        const client_name = clientNameInput.value.trim();
        const country = countrySelect.value;

        if (!amount || amount < 100) {
            showStatus('Veuillez saisir un montant valide (minimum 100 FCFA)', 'error');
            return;
        }

        if (!phone || phone.length < 8) {
            showStatus('Veuillez saisir un numéro de téléphone valide', 'error');
            return;
        }

        if (!client_name) {
            showStatus('Veuillez saisir le nom du client', 'error');
            return;
        }

        if (!country) {
            showStatus('Veuillez sélectionner un pays', 'error');
            return;
        }

        // Préparation de la requête
        const order_id = generateOrderId();
        const payload = {
            amount: amount,
            phone: phone,
            client_name: client_name,
            order_id: order_id,
            country: country
        };

        // Désactivation du bouton
        payBtn.disabled = true;
        btnText.style.display = 'none';
        btnLoader.style.display = 'inline-block';

        try {
            const response = await fetch(`${BASE_URL}/api/pay`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showStatus(
                    '✅ Paiement initié avec succès !',
                    'success',
                    `Référence: ${data.transaction_id || order_id}`
                );
                console.log('Réponse API:', data);
            } else {
                showStatus(
                    '❌ Échec du paiement',
                    'error',
                    data.message || 'Une erreur est survenue'
                );
                console.error('Erreur API:', data);
            }
        } catch (error) {
            showStatus(
                '❌ Erreur de connexion',
                'error',
                'Vérifiez votre connexion internet ou réessayez plus tard'
            );
            console.error('Erreur réseau:', error);
        } finally {
            // Réactivation du bouton
            payBtn.disabled = false;
            btnText.style.display = 'inline-flex';
            btnLoader.style.display = 'none';
        }
    });

    // Validation en temps réel du téléphone (uniquement chiffres)
    phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/[^0-9+]/g, '');
    });

    // Validation en temps réel du montant (uniquement chiffres)
    amountInput.addEventListener('input', () => {
        amountInput.value = amountInput.value.replace(/[^0-9]/g, '');
    });

    console.log('🔑 API Key utilisée:', API_KEY);
    console.log('📡 URL de l\'API:', BASE_URL);
</script>

</body>
</html>
