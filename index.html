<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flinpay - Paiement Mobile Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 560px;
            width: 100%;
            padding: 40px 35px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }

        .logo .badge {
            display: inline-block;
            background: #e8f8f0;
            color: #27ae60;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
            color: #2d3436;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #b0b0b0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .operator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .operator-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
            position: relative;
        }

        .operator-card:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .operator-card.selected {
            border-color: #667eea;
            background: #e8edff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .operator-card input[type="radio"] {
            display: none;
        }

        .operator-card .op-icon {
            font-size: 24px;
        }

        .operator-card .op-info {
            flex: 1;
        }

        .operator-card .op-name {
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        .operator-card .op-country {
            font-size: 11px;
            color: #95a5a6;
        }

        .operator-card .op-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .op-badge.mtn {
            background: #fef3e8;
            color: #e67e22;
        }

        .op-badge.orange {
            background: #fde8e8;
            color: #e74c3c;
        }

        .op-badge.moov {
            background: #e8f0fe;
            color: #2980b9;
        }

        .op-badge.airtel {
            background: #fef0e8;
            color: #d35400;
        }

        .op-badge.africell {
            background: #e8f8f0;
            color: #27ae60;
        }

        .op-badge.celtis {
            background: #f5e8f8;
            color: #8e44ad;
        }

        .op-badge.expresso {
            background: #fef8e8;
            color: #d4ac0d;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.loading .loader {
            display: block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .response-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .response-box.success {
            display: block;
            background: #e8f8f0;
            border: 2px solid #27ae60;
        }

        .response-box.error {
            display: block;
            background: #fde8e8;
            border: 2px solid #e74c3c;
        }

        .response-box .response-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .response-box.success .response-title {
            color: #27ae60;
        }

        .response-box.error .response-title {
            color: #e74c3c;
        }

        .response-box pre {
            background: rgba(0,0,0,0.05);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 8px;
        }

        .security-note {
            margin-top: 20px;
            padding: 14px 16px;
            background: #fff8e1;
            border-radius: 10px;
            border-left: 4px solid #f39c12;
            font-size: 13px;
            color: #7f8c8d;
            line-height: 1.5;
        }

        .security-note strong {
            color: #2d3436;
        }

        .security-note .lock-icon {
            margin-right: 6px;
        }

        .country-flag {
            font-size: 18px;
            margin-right: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .operator-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>💳 Flinpay</h1>
            <p>Paiement Mobile Money sécurisé</p>
            <span class="badge">🌍 7 pays couverts</span>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label>Pays <span class="required">*</span></label>
                <select id="country" required>
                    <option value="">Sélectionnez un pays</option>
                    <option value="CI">🇨🇮 Côte d'Ivoire</option>
                    <option value="CM">🇨🇲 Cameroun</option>
                    <option value="SN">🇸🇳 Sénégal</option>
                    <option value="BF">🇧🇫 Burkina Faso</option>
                    <option value="ML">🇲🇱 Mali</option>
                    <option value="BJ">🇧🇯 Bénin</option>
                    <option value="TG">🇹🇬 Togo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Opérateur <span class="required">*</span></label>
                <div class="operator-grid" id="operatorGrid">
                    <!-- Les opérateurs seront générés dynamiquement -->
                </div>
                <input type="hidden" id="operator" value="">
            </div>

            <div class="form-group">
                <label>Numéro de téléphone <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="0700000000" required>
                <small style="color: #95a5a6; font-size: 12px;">Format sans indicatif pays</small>
            </div>

            <div class="form-group">
                <label>Nom complet du client <span class="required">*</span></label>
                <input type="text" id="clientName" placeholder="Kouamé Diallo" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Montant (FCFA) <span class="required">*</span></label>
                    <input type="number" id="amount" placeholder="10000" min="100" required>
                </div>
                <div class="form-group">
                    <label>Référence commande <span class="required">*</span></label>
                    <input type="text" id="orderId" placeholder="ORD-001" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">💰 Payer maintenant</span>
                <span class="loader"></span>
            </button>
        </form>

        <div id="response" class="response-box"></div>

        <div class="security-note">
            <span class="lock-icon">🔒</span> <strong>Environnement de production</strong> — Les transactions sont réelles.
            Votre clé API reste sécurisée côté serveur.
        </div>
    </div>

    <script>
        // Clé API fournie (production)
        const API_KEY = 'fp_live_a0724e922867c0f331e82b221c5f3dd43e7f7ecaf47d5115';

        // URL de l'API Flinpay
        const API_URL = 'https://www.flinpay.cfd/api/pay';

        // Opérateurs par pays (selon la documentation Flinpay)
        const OPERATORS_BY_COUNTRY = {
            'CI': [ // Côte d'Ivoire
                { id: 'momo', name: 'MTN MoMo', icon: '📱', color: 'mtn', country: 'CI' },
                { id: 'om', name: 'Orange Money', icon: '📱', color: 'orange', country: 'CI' },
                { id: 'moov', name: 'Moov Money', icon: '📱', color: 'moov', country: 'CI' }
            ],
            'CM': [ // Cameroun
                { id: 'momo', name: 'MTN MoMo', icon: '📱', color: 'mtn', country: 'CM' },
                { id: 'om', name: 'Orange Money', icon: '📱', color: 'orange', country: 'CM' }
            ],
            'SN': [ // Sénégal
                { id: 'om', name: 'Orange Money', icon: '📱', color: 'orange', country: 'SN' },
                { id: 'momo', name: 'MTN MoMo', icon: '📱', color: 'mtn', country: 'SN' },
                { id: 'expresso', name: 'Expresso Money', icon: '📱', color: 'expresso', country: 'SN' }
            ],
            'BF': [ // Burkina Faso
                { id: 'momo', name: 'MTN MoMo', icon: '📱', color: 'mtn', country: 'BF' },
                { id: 'om', name: 'Orange Money', icon: '📱', color: 'orange', country: 'BF' },
                { id: 'moov', name: 'Moov Money', icon: '📱', color: 'moov', country: 'BF' }
            ],
            'ML': [ // Mali
                { id: 'momo', name: 'MTN MoMo', icon: '📱', color: 'mtn', country: 'ML' },
                { id: 'om', name: 'Orange Money', icon: '📱', color: 'orange', country: 'ML' }
            ],
            'BJ': [ // Bénin
                { id: 'momo', name: 'MTN MoMo', icon: '📱', color: 'mtn', country: 'BJ' },
                { id: 'om', name: 'Orange Money', icon: '📱', color: 'orange', country: 'BJ' },
                { id: 'moov', name: 'Moov Money', icon: '📱', color: 'moov', country: 'BJ' }
            ],
            'TG': [ // Togo
                { id: 'momo', name: 'MTN MoMo', icon: '📱', color: 'mtn', country: 'TG' },
                { id: 'om', name: 'Orange Money', icon: '📱', color: 'orange', country: 'TG' },
                { id: 'moov', name: 'Moov Money', icon: '📱', color: 'moov', country: 'TG' }
            ]
        };

        // Mapping des noms de pays
        const COUNTRY_NAMES = {
            'CI': 'Côte d\'Ivoire',
            'CM': 'Cameroun',
            'SN': 'Sénégal',
            'BF': 'Burkina Faso',
            'ML': 'Mali',
            'BJ': 'Bénin',
            'TG': 'Togo'
        };

        // Générer les opérateurs en fonction du pays sélectionné
        function updateOperators(countryCode) {
            const grid = document.getElementById('operatorGrid');
            const hiddenInput = document.getElementById('operator');
            
            if (!countryCode || !OPERATORS_BY_COUNTRY[countryCode]) {
                grid.innerHTML = '<p style="color: #95a5a6; font-size: 14px; grid-column: 1 / -1;">Sélectionnez un pays pour voir les opérateurs disponibles</p>';
                hiddenInput.value = '';
                return;
            }

            const operators = OPERATORS_BY_COUNTRY[countryCode];
            
            grid.innerHTML = operators.map((op, index) => `
                <div class="operator-card ${index === 0 ? 'selected' : ''}" data-operator="${op.id}" onclick="selectOperator('${op.id}')">
                    <input type="radio" name="operator" value="${op.id}" ${index === 0 ? 'checked' : ''}>
                    <span class="op-icon">${op.icon}</span>
                    <div class="op-info">
                        <div class="op-name">${op.name}</div>
                        <div class="op-country">${COUNTRY_NAMES[op.country] || op.country}</div>
                    </div>
                    <span class="op-badge ${op.color}">${op.id.toUpperCase()}</span>
                </div>
            `).join('');

            // Sélectionner le premier opérateur par défaut
            if (operators.length > 0) {
                hiddenInput.value = operators[0].id;
            }
        }

        // Sélectionner un opérateur
        window.selectOperator = function(operatorId) {
            const cards = document.querySelectorAll('.operator-card');
            const hiddenInput = document.getElementById('operator');
            
            cards.forEach(card => {
                card.classList.remove('selected');
                const radio = card.querySelector('input[type="radio"]');
                if (card.dataset.operator === operatorId) {
                    card.classList.add('selected');
                    radio.checked = true;
                    hiddenInput.value = operatorId;
                }
            });
        };

        // Écouter le changement de pays
        document.getElementById('country').addEventListener('change', function() {
            updateOperators(this.value);
        });

        // Générer un order_id par défaut
        function generateOrderId() {
            const timestamp = Date.now().toString(36).toUpperCase();
            const random = Math.random().toString(36).substring(2, 6).toUpperCase();
            return `ORD-${timestamp}-${random}`;
        }

        // Gestion du formulaire
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const responseDiv = document.getElementById('response');

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            responseDiv.className = 'response-box';
            responseDiv.innerHTML = '';

            const country = document.getElementById('country').value;
            const operator = document.getElementById('operator').value;
            const phone = document.getElementById('phone').value.trim();
            const clientName = document.getElementById('clientName').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const orderId = document.getElementById('orderId').value.trim();

            // Validations
            if (!country || !operator || !phone || !clientName || !amount || !orderId) {
                showResponse(false, 'Tous les champs sont obligatoires.');
                resetButton();
                return;
            }

            if (isNaN(amount) || amount < 100) {
                showResponse(false, 'Le montant minimum est de 100 FCFA.');
                resetButton();
                return;
            }

            if (!/^\d{9,12}$/.test(phone.replace(/\s/g, ''))) {
                showResponse(false, 'Numéro de téléphone invalide. Format: 0700000000');
                resetButton();
                return;
            }

            // Payload
            const payload = {
                amount: amount,
                phone: phone,
                client_name: clientName,
                order_id: orderId,
                country: country,
                operator: operator
            };

            console.log('📤 Envoi de la requête:', payload);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                console.log('📥 Réponse:', data);

                if (response.ok && data.ok) {
                    showResponse(true, data, payload);
                } else {
                    const errorMsg = data.error || `Erreur HTTP ${response.status}`;
                    showResponse(false, errorMsg, data);
                }
            } catch (error) {
                console.error('❌ Erreur réseau:', error);
                showResponse(false, 'Erreur de connexion au serveur. Vérifiez votre réseau.');
            } finally {
                resetButton();
            }
        });

        function showResponse(success, data, payload) {
            const responseDiv = document.getElementById('response');
            responseDiv.className = 'response-box ' + (success ? 'success' : 'error');

            if (success) {
                responseDiv.innerHTML = `
                    <div class="response-title">✅ Paiement initié avec succès</div>
                    <p style="color: #2d3436; margin-bottom: 8px; font-size: 14px;">
                        📲 Le client va recevoir une confirmation USSD sur son téléphone.
                    </p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p style="margin-top: 10px; font-size: 13px; color: #27ae60;">
                        💡 Statut: <strong>${data.status || 'pending'}</strong> — En attente de confirmation
                    </p>
                `;
            } else {
                responseDiv.innerHTML = `
                    <div class="response-title">❌ Erreur</div>
                    <p style="color: #2d3436; margin-bottom: 8px; font-size: 14px;">
                        ${typeof data === 'string' ? data : (data.error || 'Une erreur est survenue')}
                    </p>
                    ${typeof data === 'object' ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
                `;
            }

            responseDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function resetButton() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            // Générer un order_id par défaut
            const orderInput = document.getElementById('orderId');
            orderInput.value = generateOrderId();

            // Sélectionner le premier pays par défaut et charger ses opérateurs
            const countrySelect = document.getElementById('country');
            if (countrySelect.options.length > 1) {
                countrySelect.selectedIndex = 1;
                updateOperators(countrySelect.value);
            }
        });
    </script>
</body>
</html>
