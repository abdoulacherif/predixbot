<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement FlinPay</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#fff;
padding:25px;
width:400px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#0066ff;
color:#fff;
font-weight:bold;
border:none;
cursor:pointer;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

#result{
margin-top:20px;
white-space:pre-wrap;
font-size:14px;
}
</style>
</head>

<body>

<div class="card">
<h2>Paiement FlinPay</h2>

<input id="name" placeholder="Nom du client">

<input id="phone" placeholder="Téléphone">

<input id="amount" type="number" placeholder="Montant">

<select id="country">
<option value="CM">Cameroun</option>
<option value="CI">Côte d'Ivoire</option>
<option value="SN">Sénégal</option>
<option value="TG">Togo</option>
<option value="BJ">Bénin</option>
</select>

<button id="btn" onclick="payer()">
Payer
</button>

<div id="result"></div>

</div>

<script>

async function payer(){

const btn=document.getElementById("btn");
const result=document.getElementById("result");

btn.disabled=true;
btn.innerText="Paiement...";

try{

const response=await fetch("https://flinpay.vercel.app/api/pay",{

method:"POST",

headers:{
"Authorization":"Bearer fp_live_604114deefebf6bd57ee33acf852e2af7a16e841fe9edeea",
"Content-Type":"application/json"
},

body:JSON.stringify({

amount:Number(document.getElementById("amount").value),

phone:document.getElementById("phone").value,

client_name:document.getElementById("name").value,

order_id:"ORD-"+Date.now(),

country:document.getElementById("country").value

})

});

const data=await response.json();

console.log(data);

result.innerHTML="<pre>"+JSON.stringify(data,null,2)+"</pre>";

const url=data.payment_url || data.checkout_url || data.url || data.link;

if(url){

result.innerHTML+="<br><br>Redirection...";

setTimeout(()=>{
window.location.href=url;
},1000);

}

}catch(e){

result.innerHTML="Erreur : "+e.message;

}

btn.disabled=false;
btn.innerText="Payer";

}

</script>

</body>
</html>
