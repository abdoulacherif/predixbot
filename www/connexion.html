<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Connexion — Kontak</title>
<script>window.API_BASE = 'https://kontaks.vercel.app';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--card:#FFFFFF;--ink:#0E2A1B;--green:#25D366;--green-dark:#128C4A;--line:rgba(14,42,27,0.08);--muted:rgba(14,42,27,0.55);--err:#D9534F;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
a{color:inherit;text-decoration:none;}

.app-header{background:var(--card);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.logo{font-family:'Fraunces',serif;font-style:italic;font-size:22px;display:flex;align-items:center;gap:8px;}
.logo img{width:32px;height:32px;border-radius:8px;}
.logo span{color:var(--green-dark);}
.btn-line{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:9px 16px;border-radius:100px;font-weight:600;font-size:13px;}

.container{flex:1;padding:30px 20px;max-width:480px;margin:0 auto;width:100%;box-sizing:border-box;}
.greeting{margin-bottom:24px;text-align:center;}
.greeting h1{font-size:28px;margin-bottom:6px;}
.greeting p{color:var(--muted);font-size:14px;}

.card{background:var(--card);border-radius:24px;padding:24px;border:1px solid var(--line);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-family:'Space Mono',monospace;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Sora',sans-serif;font-size:15px;background:var(--bg);color:var(--ink);outline:none;}
.field input:focus{border-color:var(--green);background:#fff;}

.btn-primary{width:100%;background:var(--green);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;}
.btn-primary:disabled{opacity:0.5;}
.err-msg{font-size:13px;color:var(--err);margin-top:10px;display:none;text-align:center;}
.err-msg.show{display:block;}

.switch-link{text-align:center;font-size:14px;color:var(--muted);margin-top:20px;}
.switch-link a{color:var(--green-dark);font-weight:700;}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="app-header">
  <a class="logo" href="./index.html"><img src="logo.png" alt="Kontak">Kon<span>tak</span></a>
  <a class="btn-line" href="./annuaire.html">← Annuaire</a>
</header>

<div class="container">
  <div class="greeting">
    <h1>Content de te revoir 👋</h1>
    <p>Connecte-toi pour accéder à ton espace.</p>
  </div>

  <div class="card">
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="l-email" required placeholder="ton@email.com"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="l-pass" required placeholder="••••••••"></div>
      <div class="err-msg" id="errLogin"></div>
      <button type="submit" class="btn-primary" id="loginBtn" style="margin-top:8px;">Se connecter</button>
    </form>
    <div class="switch-link">Pas encore de compte ? <a href="./inscription.html">S'inscrire</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }
function showErr(id,msg){ const e=document.getElementById(id); e.textContent=msg; e.classList.add('show'); }
function hideErr(id){ const e=document.getElementById(id); e.classList.remove('show'); }

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Connexion…';
  hideErr('errLogin');

  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;

  try{
    const res = await fetch(window.API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Email ou mot de passe incorrect.');

    showToast('Connexion réussie ✓');
    setTimeout(() => window.location.href = './dashboard.html', 500);
  }catch(err){
    showErr('errLogin', err.message || "Erreur de connexion.");
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});
</script>
</body>
</html>
