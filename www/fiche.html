<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fiche — Kontak</title>
<script>window.API_BASE = 'https://kontaks.vercel.app';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--card:#FFFFFF;--ink:#0E2A1B;--green:#25D366;--green-dark:#128C4A;--line:rgba(14,42,27,0.08);--muted:rgba(14,42,27,0.55);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',sans-serif;padding-bottom:40px;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
a{color:inherit;text-decoration:none;}

.app-header{background:var(--card);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);}
.logo{font-family:'Fraunces',serif;font-style:italic;font-size:22px;display:flex;align-items:center;gap:8px;}
.logo img{width:32px;height:32px;border-radius:8px;}
.logo span{color:var(--green-dark);}
.btn-line{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:9px 16px;border-radius:100px;font-weight:600;font-size:13px;}

.container{padding:20px;max-width:600px;margin:0 auto;}
.hero-card{background:var(--card);border-radius:24px;padding:24px;text-align:center;margin-bottom:16px;border:1px solid var(--line);}
.avatar{width:100px;height:100px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:36px;margin:0 auto 16px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 24px -8px rgba(14,42,27,0.25);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.hero-card h1{font-size:24px;margin-bottom:6px;}
.hero-loc{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:0.6px;font-family:'Space Mono',monospace;}
.hero-tag{display:inline-block;margin-top:12px;background:var(--bg);color:var(--green-dark);padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700;text-transform:uppercase;}

.block{background:var(--card);border-radius:20px;padding:22px;margin-bottom:16px;border:1px solid var(--line);}
.block h2{font-size:16px;margin-bottom:10px;}
.block p{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#fff;padding:16px;border-radius:100px;font-weight:700;font-size:16px;width:100%;border:none;cursor:pointer;margin-top:8px;}
.wa-btn svg{width:22px;height:22px;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);}
.not-found{text-align:center;padding:60px 20px;}
.not-found h1{font-size:22px;margin-bottom:10px;}
.not-found p{color:var(--muted);font-size:14.5px;margin-bottom:20px;}
.not-found a{background:var(--green);color:#fff;padding:12px 24px;border-radius:100px;font-weight:700;display:inline-block;}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="app-header">
  <a class="logo" href="./index.html"><img src="logo.png" alt="Kontak">Kon<span>tak</span></a>
  <a class="btn-line" href="./annuaire.html">← Annuaire</a>
</header>

<div id="loader" class="loading">Chargement…</div>

<div id="content" class="container" style="display:none;">
  <div class="hero-card">
    <div class="avatar" id="avatar">?</div>
    <h1 id="businessName">—</h1>
    <div class="hero-loc" id="location">—</div>
    <div class="hero-tag" id="tag" style="display:none;">—</div>
  </div>

  <div class="block">
    <h2>À propos</h2>
    <p id="aboutText">—</p>
  </div>

  <div class="block">
    <h2>Contacter sur WhatsApp</h2>
    <p style="margin-bottom:14px;color:var(--muted);font-size:13.5px;">Le message s'ouvre pré-rempli, il ne reste qu'à envoyer.</p>
    <button class="wa-btn" id="waBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.297-.497.1-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.553 4.12 1.52 5.855L.012 24l6.317-1.652A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.826 0-3.542-.5-5.02-1.372l-.36-.212-3.75.98.999-3.65-.234-.375A9.94 9.94 0 012 12c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10z"/></svg>
        Ouvrir WhatsApp
      </button>
  </div>
</div>

<div id="notFound" class="not-found" style="display:none;">
  <h1>Fiche introuvable</h1>
  <p>Ce profil n'existe pas ou a été retiré de l'annuaire.</p>
  <a href="./annuaire.html">Retour à l'annuaire</a>
</div>

<div class="toast" id="toast"></div>

<script>
function initials(name){ return (name||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function loadProfile() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const id = params.get('id');

  if (!slug && !id) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('notFound').style.display = 'block';
    return;
  }

  let apiUrl = window.API_BASE + '/api/profiles?action=public';
  if (slug) apiUrl += '&slug=' + encodeURIComponent(slug);
  else if (id) apiUrl += '&id=' + encodeURIComponent(id);

  try {
    const res = await fetch(apiUrl, { credentials: 'include' });
    const data = await res.json();

    if (!res.ok || !data.profile) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('notFound').style.display = 'block';
      return;
    }

    const p = data.profile;
    document.getElementById('businessName').textContent = p.business || p.nom || 'Sans nom';
    document.getElementById('location').textContent = [p.ville, p.pays].filter(Boolean).join(', ') || '—';
    document.getElementById('aboutText').textContent = p.description || "Ce business n'a pas encore ajouté de description.";
    document.title = (p.business || p.nom || 'Fiche') + ' — Kontak';

    const tag = document.getElementById('tag');
    if (p.secteur) { tag.textContent = p.secteur; tag.style.display = 'inline-block'; }

    const avatar = document.getElementById('avatar');
    if (p.avatar_url) avatar.innerHTML = `<img src="${escapeHtml(p.avatar_url)}" alt="">`;
    else avatar.textContent = initials(p.business || p.nom);

    const waBtn = document.getElementById('waBtn');
    const cleanPhone = (p.whatsapp || '').replace(/\D/g, '');
    const message = encodeURIComponent(`Bonjour, je vous ai trouvé sur Kontak — je voudrais discuter de ${p.business || 'votre activité'}.`);

    waBtn.addEventListener('click', () => {
      fetch(window.API_BASE + '/api/profiles?action=track-click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ userId: p.user_id })
      }).catch(() => {});
      window.open(`https://wa.me/${cleanPhone}?text=${message}`, '_blank');
    });

    document.getElementById('loader').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (e) {
    console.error(e);
    document.getElementById('loader').style.display = 'none';
    document.getElementById('notFound').style.display = 'block';
  }
}

loadProfile();
</script>
</body>
</html>
