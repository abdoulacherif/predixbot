<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S'inscrire — Kontak</title>
<script>window.API_BASE = 'https://kontaks.vercel.app';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--card:#FFFFFF;--ink:#0E2A1B;--green:#25D366;--green-dark:#128C4A;--line:rgba(14,42,27,0.08);--muted:rgba(14,42,27,0.55);--err:#D9534F;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',sans-serif;min-height:100vh;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
a{color:inherit;text-decoration:none;}

.app-header{background:var(--card);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.logo{font-family:'Fraunces',serif;font-style:italic;font-size:22px;display:flex;align-items:center;gap:8px;}
.logo img{width:32px;height:32px;border-radius:8px;}
.logo span{color:var(--green-dark);}
.btn-line{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:9px 16px;border-radius:100px;font-weight:600;font-size:13px;}

.container{padding:30px 20px;max-width:480px;margin:0 auto;}
.greeting{margin-bottom:24px;text-align:center;}
.greeting h1{font-size:26px;margin-bottom:6px;}
.greeting p{color:var(--muted);font-size:14px;}

.card{background:var(--card);border-radius:24px;padding:24px;border:1px solid var(--line);}

.stepper{display:flex;gap:6px;margin-bottom:22px;}
.stepper .dot{flex:1;height:4px;border-radius:100px;background:var(--line);}
.stepper .dot.active{background:var(--green);}

.step-panel{display:none;}
.step-panel.active{display:block;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-family:'Space Mono',monospace;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input, .field select{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Sora',sans-serif;font-size:15px;background:var(--bg);color:var(--ink);outline:none;}
.field input:focus, .field select:focus{border-color:var(--green);background:#fff;}

.btn-primary{width:100%;background:var(--green);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;}
.btn-primary:disabled{opacity:0.5;}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:16px;border-radius:14px;font-weight:600;font-size:15px;cursor:pointer;}
.actions{display:flex;gap:10px;margin-top:8px;}
.actions .btn-primary{flex:1;}
.actions .btn-ghost{flex:1;}

.err-msg{font-size:13px;color:var(--err);margin-top:10px;display:none;text-align:center;}
.err-msg.show{display:block;}

.switch-link{text-align:center;font-size:14px;color:var(--muted);margin-top:20px;}
.switch-link a{color:var(--green-dark);font-weight:700;}

.success-message{text-align:center;padding:20px 0;}
.success-message h3{color:var(--green-dark);margin-bottom:10px;}
.success-message p{color:var(--muted);font-size:14px;line-height:1.6;}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="app-header">
  <a class="logo" href="./index.html"><img src="logo.png" alt="Kontak">Kon<span>tak</span></a>
  <a class="btn-line" href="./annuaire.html">← Annuaire</a>
</header>

<div class="container">
  <div class="greeting">
    <h1>Rejoins le réseau 🚀</h1>
    <p>Crée ton compte en 3 étapes.</p>
  </div>

  <div class="card">
    <div class="stepper">
      <div class="dot active" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <form id="signupForm">
      <div class="step-panel active" id="step1">
        <div class="field"><label>Nom complet</label><input type="text" id="s-name" required placeholder="Ex: Aïcha Diallo"></div>
        <div class="field"><label>Numéro WhatsApp</label><input type="tel" id="s-phone" required placeholder="Ex: +221771234567"></div>
        <div class="field"><label>Email</label><input type="email" id="s-email" required placeholder="ton@email.com"></div>
        <div class="err-msg" id="err1"></div>
        <button type="button" class="btn-primary" onclick="goToStep(2)" style="margin-top:8px;">Suivant</button>
      </div>

      <div class="step-panel" id="step2">
        <div class="field"><label>Pays</label><input type="text" id="s-country" required placeholder="Ex: Sénégal"></div>
        <div class="field"><label>Ville</label><input type="text" id="s-city" required placeholder="Ex: Dakar"></div>
        <div class="field"><label>Nom du business</label><input type="text" id="s-business" required placeholder="Ex: Aïcha Créations"></div>
        <div class="field"><label>Secteur</label><select id="s-sector" required><option value="">Choisir…</option></select></div>
        <div class="err-msg" id="err2"></div>
        <div class="actions">
          <button type="button" class="btn-ghost" onclick="goToStep(1)">Retour</button>
          <button type="button" class="btn-primary" onclick="goToStep(3)">Suivant</button>
        </div>
      </div>

      <div class="step-panel" id="step3">
        <div class="field"><label>Mot de passe</label><input type="password" id="s-pass" required placeholder="Minimum 6 caractères"></div>
        <div class="field"><label>Répéter le mot de passe</label><input type="password" id="s-pass2" required placeholder="Retape ton mot de passe"></div>
        <div class="err-msg" id="err3"></div>
        <div class="actions">
          <button type="button" class="btn-ghost" onclick="goToStep(2)">Retour</button>
          <button type="submit" class="btn-primary" id="submitBtn">S'inscrire</button>
        </div>
      </div>
    </form>

    <div class="switch-link">Déjà inscrit ? <a href="./connexion.html">Se connecter</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SECTORS = ['Commerce','Mode & beauté','Restauration','Services','Tech & digital','Immobilier','Éducation','Autre'];

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function showToast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }
function showErr(id,msg){ const e=document.getElementById(id); if(!e) return; e.textContent=msg; e.classList.add('show'); }
function hideErr(id){ const e=document.getElementById(id); if(e) e.classList.remove('show'); }

document.getElementById('s-sector').innerHTML = '<option value="">Choisir…</option>' + SECTORS.map(s=>`<option>${s}</option>`).join('');

function goToStep(n){
  if(n===2){
    const name = document.getElementById('s-name').value.trim();
    const phone = document.getElementById('s-phone').value.trim();
    const email = document.getElementById('s-email').value.trim();
    if(!name || !phone || !email){ showErr('err1','Remplis tous les champs.'); return; }
    hideErr('err1');
  }
  if(n===3){
    const country = document.getElementById('s-country').value.trim();
    const city = document.getElementById('s-city').value.trim();
    const business = document.getElementById('s-business').value.trim();
    const sector = document.getElementById('s-sector').value;
    if(!country || !city || !business || !sector){ showErr('err2','Remplis tous les champs.'); return; }
    hideErr('err2');
  }
  ['step1','step2','step3'].forEach((id,i)=> document.getElementById(id).classList.toggle('active', i===n-1));
  ['dot1','dot2','dot3'].forEach((id,i)=> document.getElementById(id).classList.toggle('active', i<=n-1));
}

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pass = document.getElementById('s-pass').value;
  const pass2 = document.getElementById('s-pass2').value;
  if(pass.length < 6){ showErr('err3','Minimum 6 caractères.'); return; }
  if(pass !== pass2){ showErr('err3','Les mots de passe ne correspondent pas.'); return; }
  hideErr('err3');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Inscription…';

  const name = document.getElementById('s-name').value.trim();
  const phone = document.getElementById('s-phone').value.trim();
  const email = document.getElementById('s-email').value.trim();
  const country = document.getElementById('s-country').value.trim();
  const city = document.getElementById('s-city').value.trim();
  const business = document.getElementById('s-business').value.trim();
  const sector = document.getElementById('s-sector').value;

  const params = new URLSearchParams(window.location.search);
  const referredBy = params.get('ref') || null;

  try{
    const res = await fetch(window.API_BASE + '/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ name, phone, email, password: pass, country, city, business, sector, referredBy })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Une erreur est survenue.');

    document.querySelector('.card').innerHTML = `
      <div class="success-message">
        <h3>Vérifie ta boîte mail</h3>
        <p>Un email de confirmation a été envoyé à <strong>${escapeHtml(email)}</strong>. Clique sur le lien pour activer ton compte.</p>
      </div>
    `;

  }catch(err){
    showErr('err3', err.message || "Erreur lors de l'inscription.");
    btn.disabled = false; btn.textContent = "S'inscrire";
  }
});
</script>
</body>
</html>
