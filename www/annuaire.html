<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Annuaire — Kontak</title>
<script>window.API_BASE = 'https://kontaks.vercel.app';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F9FA; --card:#FFFFFF; --ink:#0E2A1B; 
  --green:#25D366; --green-dark:#128C4A; --gold:#E8A33D; 
  --line:rgba(14,42,27,0.08); --muted:rgba(14,42,27,0.55); --err:#D9534F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
a{color:inherit;text-decoration:none;}

/* HEADER */
.app-header{background:var(--card);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);}
.header-left{display:flex;align-items:center;gap:12px;}
.logo{font-family:'Fraunces',serif;font-style:italic;font-size:22px;display:flex;align-items:center;gap:8px;}
.logo img{width:32px;height:32px;border-radius:8px;}
.logo span{color:var(--green-dark);}
.burger{background:none;border:none;font-size:24px;cursor:pointer;padding:4px;}

/* SEARCH */
.search-wrap{padding:16px 20px 8px;background:var(--card);}
.search-box{background:var(--bg);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.search-box input{background:transparent;border:none;outline:none;font-family:'Sora',sans-serif;font-size:15px;flex:1;color:var(--ink);}
.search-box svg{width:20px;height:20px;color:var(--muted);}

/* FILTERS */
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 16px;background:var(--card);scrollbar-width:none;border-bottom:1px solid var(--line);}
.filters::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:8px 16px;border-radius:100px;border:1.5px solid var(--line);font-size:13px;color:var(--muted);background:#fff;cursor:pointer;white-space:nowrap;font-weight:500;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* GRID */
.container{padding:20px;max-width:600px;margin:0 auto;}
.stats-bar{font-size:12px;color:var(--muted);margin-bottom:16px;text-align:center;}
.grid{display:flex;flex-direction:column;gap:16px;}

/* CARD */
.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(14,42,27,0.03);}
.card-top{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.card-info{flex:1;}
.card-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:6px;}
.card-name .star{color:var(--gold);font-size:16px;}
.card-loc{font-size:13px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px;}
.card-loc svg{width:12px;height:12px;}
.card-cat{display:inline-block;margin-top:8px;font-size:11px;background:var(--bg);color:var(--green-dark);padding:4px 10px;border-radius:100px;font-weight:700;text-transform:uppercase;}

/* ACTIONS */
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.btn-action{padding:12px;border-radius:12px;border:none;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
.btn-action svg{width:16px;height:16px;}
.btn-wa{background:var(--green);color:#fff;}
.btn-save{background:var(--bg);color:var(--ink);border:1px solid var(--line);}

/* NAVBAR */
.mobile-bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(14,42,27,0.06);}
.mobile-bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;flex:1;text-align:center;}
.mobile-bottom-nav a.active{color:var(--green-dark);}

/* MODAL MENU BURGER */
.overlay-menu{position:fixed;inset:0;background:rgba(14,42,27,0.5);backdrop-filter:blur(4px);display:none;z-index:100;}
.overlay-menu.open{display:block;}
.menu-panel{position:fixed;top:0;right:-300px;width:280px;height:100vh;background:#fff;z-index:101;transition:right 0.3s ease;box-shadow:-4px 0 24px rgba(0,0,0,0.1);padding:24px 20px;overflow-y:auto;}
.menu-panel.open{right:0;}
.menu-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.menu-title{font-family:'Fraunces',serif;font-style:italic;font-size:22px;}
.menu-close{background:none;border:none;font-size:22px;cursor:pointer;}
.menu-link{display:block;padding:12px;border-radius:10px;font-weight:600;color:var(--ink);margin-bottom:4px;font-size:15px;}
.menu-link.active{background:var(--bg-soft);color:var(--green-dark);}
.menu-danger{display:block;padding:12px;border-radius:10px;font-weight:600;color:var(--err);margin-top:16px;border-top:1px solid var(--line);padding-top:20px;}

/* MODAL SAVE */
.overlay-save{position:fixed;inset:0;background:rgba(14,42,27,0.5);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:200;}
.overlay-save.open{display:flex;}
.save-modal{background:#fff;width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:24px 20px 30px;max-height:90vh;overflow-y:auto;}
.save-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.save-header h2{font-size:20px;}
.save-close{background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;}
.save-contact-name{color:var(--muted);font-size:14px;margin-bottom:16px;}
.dl-option{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;margin-bottom:10px;width:100%;text-align:left;font-family:'Sora',sans-serif;}
.dl-option:hover{border-color:var(--green);}
.dl-option svg{width:22px;height:22px;color:var(--green-dark);flex-shrink:0;}
.dl-title{font-weight:700;font-size:14px;color:var(--ink);}
.dl-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.error{background:var(--err);}
.toast.success{background:var(--green-dark);}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <a class="logo" href="./dashboard.html">
      <img src="logo.png" alt="Kontak">
      Kon<span>tak</span>
    </a>
  </div>
  <button class="burger" onclick="toggleMenu()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="Rechercher un business, une ville…" oninput="debouncedRender()">

  <div class="grid" id="grid">
    <div class="empty" style="text-align:center;padding:40px 0;color:var(--muted);">Chargement…</div>
  </div>
</div>

<!-- NAVBAR MOBILE -->
<nav class="mobile-bottom-nav">
  <a href="./dashboard.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7"/><path d="M9 22V12h6v10"/></svg>
    Accueil
  </a>
  <a href="./annuaire.html" class="active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Annuaire
  </a>
  <a href="./profile.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>

<!-- MENU BURGER -->
<div class="overlay-menu" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="menu-panel" id="menuPanel">
  <div class="menu-header">
    <span class="menu-title">Kon<span style="color:var(--green-dark);">tak</span></span>
    <button class="menu-close" onclick="toggleMenu()">✕</button>
  </div>
  <a href="./dashboard.html" class="menu-link">🏠 Tableau de bord</a>

  <a href="./support.html" class="menu-link">🆘 Support</a>

</div>

<!-- MODAL SAVE -->
<div class="overlay-save" id="saveOverlay">
  <div class="save-modal">
    <div class="save-header">
      <h2>Enregistrer ce contact</h2>
      <button class="save-close" onclick="closeSaveMenu()">✕</button>
    </div>

    <button class="dl-option" onclick="saveToPhoneBook()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <div>
        <div class="dl-title">Enregistrer dans le répertoire</div>
        <div class="dl-sub">Ajout automatique à tes contacts</div>
      </div>
    </button>
    <button class="dl-option" onclick="downloadCSV()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <div>
        <div class="dl-title">Télécharger en CSV</div>
        <div class="dl-sub">Compatible Excel, Google Sheets</div>
      </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SECTORS = ['Commerce','Mode & beauté','Restauration','Services','Tech & digital','Immobilier','Éducation','Autre'];
let profiles = [];
let activeFilter = 'Tous';
let totalCount = 0;
let currentOffset = 0;
const PAGE_SIZE = 30;
let loadToken = 0;
let ACTIVE_CONTACT = null;

function initials(name){ return (name||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function showToast(msg, type='success'){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3500); }

async function logout() {
  await fetch(window.API_BASE + '/api/auth/session', { method: 'DELETE', credentials: 'include' });
  window.location.href = './index.html';
}

function toggleMenu() {
  document.getElementById('menuPanel').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('open');
}

function renderFilters(){
  const el = document.getElementById('filters');
  const cats = ['Tous', ...SECTORS];
  el.innerHTML = cats.map(c=>`<button class="chip ${c===activeFilter?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');
}
function setFilter(c){ activeFilter = c; render(true); }
function debounce(fn, delay){ let t; return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), delay); }; }
const debouncedRender = debounce(()=> render(true), 350);

async function render(reset){
  renderFilters();
  const myToken = ++loadToken;
  if(reset){
    currentOffset = 0;
    profiles = [];
    document.getElementById('grid').innerHTML = `<div class="empty" style="text-align:center;padding:40px 0;color:var(--muted);">Chargement…</div>`;
  }
  const q = document.getElementById('searchInput').value.trim();
  try{
    const params = new URLSearchParams();
    if(activeFilter !== 'Tous') params.set('sector', activeFilter);
    if(q) params.set('q', q);
    params.set('offset', currentOffset);
    params.set('limit', PAGE_SIZE);

    const res = await fetch(window.API_BASE + `/api/directory/list?${params.toString()}`, { credentials: 'include' });
    if(!res.ok) throw new Error('Erreur');
    const data = await res.json();
    if(myToken !== loadToken) return;
    if(reset){ profiles = data.profiles || []; } else { profiles = profiles.concat(data.profiles || []); }
    totalCount = data.total ?? profiles.length;
    currentOffset = profiles.length;
    renderGrid();
  }catch(e){
    console.error(e);
    if(myToken === loadToken) document.getElementById('grid').innerHTML = `<div class="empty" style="text-align:center;padding:40px 0;color:var(--muted);">Erreur de chargement.</div>`;
  }
}

function renderGrid(){
  document.getElementById('statsBar').textContent = `${totalCount} membre${totalCount!==1?'s':''} · ${profiles.length} affiché${profiles.length!==1?'s':''}`;
  const grid = document.getElementById('grid');
  if(profiles.length===0){
    grid.innerHTML = `<div class="empty" style="text-align:center;padding:40px 0;color:var(--muted);">Aucun membre trouvé.</div>`;
    return;
  }
  const cardsHtml = profiles.map(c=>`
    <div class="card">
      <div class="card-top">
        <div class="avatar">${c.avatar_url ? `<img src="${escapeHtml(c.avatar_url)}">` : initials(c.business || c.nom)}</div>
        <div class="card-info">
          <div class="card-name">${escapeHtml(c.business || c.nom)} ${c.is_boosted ? '<span class="star">⭐</span>' : ''}</div>
          <div class="card-loc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${escapeHtml(c.ville || '')}${c.pays ? ', '+escapeHtml(c.pays) : ''}
          </div>
          <div class="card-cat">${escapeHtml(c.secteur || '')}</div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-action btn-wa" onclick="contactWhatsapp('${escapeHtml(c.whatsapp)}', '${escapeHtml(c.business || c.nom)}')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.297-.497.1-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.553 4.12 1.52 5.855L.012 24l6.317-1.652A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.826 0-3.542-.5-5.02-1.372l-.36-.212-3.75.98.999-3.65-.234-.375A9.94 9.94 0 012 12c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10z"/></svg>
          WhatsApp
        </button>
        <button class="btn-action btn-save" onclick="openSaveMenu('${escapeHtml(c.business || c.nom)}', '${escapeHtml(c.whatsapp)}', '${escapeHtml(c.ville || '')}', '${escapeHtml(c.pays || '')}', '${escapeHtml(c.secteur || '')}', '${escapeHtml(c.user_id || '')}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Enregistrer
        </button>
      </div>
    </div>
  `).join('');
  const hasMore = profiles.length < totalCount;
  grid.innerHTML = cardsHtml + (hasMore
    ? `<button style="width:100%;margin-top:10px;padding:14px;background:var(--green);color:#fff;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;" onclick="render(false)">Charger plus (${totalCount - profiles.length} restants)</button>`
    : '');
}

function contactWhatsapp(phone, business){
  const clean = (phone || '').replace(/\D/g, '');
  const msg = encodeURIComponent(`Bonjour, je vous ai trouvé sur Kontak — je voudrais discuter de ${business || 'votre activité'}.`);
  window.open(`https://wa.me/${clean}?text=${msg}`, '_blank');
}

function openSaveMenu(business, phone, ville, pays, secteur, targetUserId) {
  ACTIVE_CONTACT = { business, phone, ville, pays, secteur, targetUserId };
  document.getElementById('saveContactName').textContent = business;
  document.getElementById('saveOverlay').classList.add('open');
}
function closeSaveMenu() {
  document.getElementById('saveOverlay').classList.remove('open');
}

async function saveToPhoneBook() {
  if (!ACTIVE_CONTACT) return;
  const { business, phone, ville, pays, secteur, targetUserId } = ACTIVE_CONTACT;
  const cleanPhone = (phone || '').replace(/\D/g, '');
  if (!cleanPhone) return showToast('Numéro invalide.', 'error');

  try {
    if (window.Contacts) {
      const perm = await window.Contacts.checkPermissions();
      if (perm.contacts !== 'granted') {
        const req = await window.Contacts.requestPermissions();
        if (req.contacts !== 'granted') {
          return showToast('Permission refusée.', 'error');
        }
      }
      await window.Contacts.createContact({
        contact: {
          name: { given: business, family: '' },
          organization: { company: 'Kontak', title: secteur || '' },
          phones: [{ label: 'mobile', number: cleanPhone }],
          addresses: [{ label: 'home', street: '', city: ville || '', country: pays || '', postalCode: '', region: '', type: 'home' }],
          note: 'Via l annuaire Kontak'
        }
      });
      showToast('Contact enregistré dans ton téléphone ✓', 'success');
      closeSaveMenu();
      return;
    }
  } catch (error) {
    console.error('Save contact error:', error);
  }

  // Fallback : VCF
  const vcard = [
    'BEGIN:VCARD', 'VERSION:3.0',
    'FN:' + business, 'ORG:Kontak', 'TITLE:' + (secteur || ''),
    'TEL;TYPE=CELL:' + cleanPhone,
    'ADR:;;' + (ville || '') + ';;;' + (pays || ''),
    'NOTE:Via l annuaire Kontak', 'END:VCARD'
  ].join(String.fromCharCode(13, 10));

  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  showToast('Choisis "Ajouter aux contacts" ✓', 'success');
  setTimeout(() => {
    window.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }, 600);
  closeSaveMenu();
}

async function downloadCSV() {
  if (!ACTIVE_CONTACT) return;
  const { business, phone, ville, pays, secteur } = ACTIVE_CONTACT;
  const cleanPhone = (phone || '').replace(/\D/g, '');
  if (!cleanPhone) return showToast('Numéro invalide.', 'error');

  const NL = String.fromCharCode(10);
  const header = 'Nom,Business,WhatsApp,Ville,Pays,Secteur,Source';
  const row = [business, business, cleanPhone, ville, pays, secteur, 'Kontak']
    .map(v => '"' + String(v || '').replace(/"/g, '""') + '"')
    .join(',');
  const csv = header + NL + row;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kontak-' + (business || 'contact').replace(/\s+/g, '-').toLowerCase() + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  showToast('Fichier CSV téléchargé ✓', 'success');
  closeSaveMenu();
}

// Init
(async () => {
  renderFilters();
  render(true);
  // Demander la permission au démarrage
  if (window.Contacts) {
    try {
      const perm = await window.Contacts.checkPermissions();
      if (perm.contacts !== 'granted') await window.Contacts.requestPermissions();
    } catch(e) { console.log(e); }
  }
})();
</script>
