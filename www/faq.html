<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAQ — Kontak</title>
<script>window.API_BASE = 'https://kontaks.vercel.app';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--card:#FFFFFF;--ink:#0E2A1B;--green:#25D366;--green-dark:#128C4A;--gold:#E8A33D;--line:rgba(14,42,27,0.08);--muted:rgba(14,42,27,0.55);--err:#D9534F;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',sans-serif;padding-bottom:80px;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
a{color:inherit;text-decoration:none;}

.app-header{background:var(--card);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);}
.logo{font-family:'Fraunces',serif;font-style:italic;font-size:22px;display:flex;align-items:center;gap:8px;}
.logo img{width:32px;height:32px;border-radius:8px;}
.logo span{color:var(--green-dark);}
.burger{background:none;border:none;font-size:24px;cursor:pointer;padding:4px;}

.container{padding:20px;max-width:600px;margin:0 auto;}
.greeting{margin-bottom:24px;}
.greeting h1{font-size:24px;margin-bottom:4px;}
.greeting p{color:var(--muted);font-size:14px;margin:0;}

/* FAQ */
.faq-item{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;}
.faq-q{width:100%;text-align:left;background:none;border:none;padding:18px;font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.faq-q svg{width:18px;height:18px;color:var(--green-dark);flex-shrink:0;transition:transform 0.2s;}
.faq-item.open .faq-q svg{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height 0.3s ease;}
.faq-item.open .faq-a{max-height:400px;}
.faq-a p{padding:0 18px 18px;font-size:14px;color:var(--muted);line-height:1.6;margin:0;}

/* NAVBAR */
.mobile-bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(14,42,27,0.06);}
.mobile-bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;flex:1;text-align:center;}
.mobile-bottom-nav a.active{color:var(--green-dark);}

/* MENU BURGER */
.overlay-menu{position:fixed;inset:0;background:rgba(14,42,27,0.5);backdrop-filter:blur(4px);display:none;z-index:100;}
.overlay-menu.open{display:block;}
.menu-panel{position:fixed;top:0;right:-300px;width:280px;height:100vh;background:#fff;z-index:101;transition:right 0.3s ease;box-shadow:-4px 0 24px rgba(0,0,0,0.1);padding:24px 20px;overflow-y:auto;}
.menu-panel.open{right:0;}
.menu-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.menu-title{font-family:'Fraunces',serif;font-style:italic;font-size:22px;}
.menu-close{background:none;border:none;font-size:22px;cursor:pointer;}
.menu-link{display:block;padding:12px;border-radius:10px;font-weight:600;color:var(--ink);margin-bottom:4px;font-size:15px;}
.menu-link.active{background:var(--bg);color:var(--green-dark);}
.menu-danger{display:block;padding:12px;border-radius:10px;font-weight:600;color:var(--err);margin-top:16px;border-top:1px solid var(--line);padding-top:20px;}
</style>
</head>
<body>

<header class="app-header">
  <a class="logo" href="./dashboard.html"><img src="logo.png" alt="Kontak">Kon<span>tak</span></a>
  <button class="burger" onclick="toggleMenu()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
</header>

<div class="container">
  <div class="greeting">
    <h1>FAQ ❓</h1>
    <p>Les questions les plus fréquentes.</p>
  </div>
  <div id="faqWrap"></div>
</div>

<nav class="mobile-bottom-nav">
  <a href="./dashboard.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7"/><path d="M9 22V12h6v10"/></svg>Accueil</a>
  <a href="./annuaire.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Annuaire</a>
  <a href="./profile.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</a>
  <a href="#" onclick="logout();return false;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9534F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Quitter</a>
</nav>

<div class="overlay-menu" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="menu-panel" id="menuPanel">
  <div class="menu-header"><span class="menu-title">Kon<span style="color:var(--green-dark);">tak</span></span><button class="menu-close" onclick="toggleMenu()">✕</button></div>
  <a href="./dashboard.html" class="menu-link">🏠 Tableau de bord</a>
  <a href="./annuaire.html" class="menu-link">📒 Annuaire</a>
  <a href="./profile.html" class="menu-link">👤 Mon profil</a>
  <a href="./abonnement.html" class="menu-link">💳 Crédits</a>
  <a href="./mail.html" class="menu-link">✉️ Campagnes mail</a>
  <a href="./parrainage.html" class="menu-link">🎁 Parrainage</a>
  <a href="./support.html" class="menu-link">🆘 Support</a>
  <a href="#" onclick="logout();return false;" class="menu-danger">🚪 Déconnexion</a>
</div>

<script>
function logout(){
  fetch(window.API_BASE + '/api/auth/session', { method: 'DELETE', credentials: 'include' })
    .finally(() => window.location.href = './index.html');
}
function toggleMenu(){
  document.getElementById('menuPanel').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('open');
}

const FAQ_ITEMS = [
  { q: "C'est quoi Kontak ?", a: "Un annuaire où tu trouves des contacts business et où on te trouve aussi. Chaque membre a une fiche avec son WhatsApp, sa ville et son secteur d'activité." },
  { q: "Comment fonctionnent les crédits ?", a: "Chaque nouveau compte reçoit 150 crédits offerts. Contacter un membre sur WhatsApp ou télécharger une fiche coûte 2 crédits. Tu peux racheter des crédits depuis la page Crédits." },
  { q: "Est-ce que je peux contacter sans compte ?", a: "Non, il faut être connecté pour contacter un membre ou télécharger un contact — ça protège les membres d'un usage abusif." },
  { q: "C'est quoi le parrainage ?", a: "Tu as un lien unique à partager. Quand un ami s'inscrit avec, il devient ton filleul et tu gagnes 5 crédits." },
  { q: "Comment je récupère mon solde ?", a: "Depuis le tableau de bord, clique sur 'Retirer mon solde' et indique ton moyen de paiement. La demande est traitée manuellement." },
  { q: "À quoi sert l'abonnement ?", a: "Il donne accès à des avantages sans toucher à tes crédits (emails en masse, mise en avant). Les forfaits sont visibles sur la page Crédits." },
  { q: "Comment ajouter ma fiche à l'annuaire ?", a: "Elle est créée automatiquement à l'inscription. Tu peux la modifier à tout moment depuis la page Profil." },
  { q: "J'ai un problème, comment vous contacter ?", a: "Utilise la page Support — formulaire de contact ou email direct à kontakssupport@gmail.com." },
];

function renderFaq(){
  document.getElementById('faqWrap').innerHTML = FAQ_ITEMS.map((item, i)=>`
    <div class="faq-item" id="faqItem${i}">
      <button class="faq-q" onclick="toggleFaq(${i})">
        <span>${item.q}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="faq-a"><p>${item.a}</p></div>
    </div>
  `).join('');
}
function toggleFaq(i){
  document.getElementById(`faqItem${i}`).classList.toggle('open');
}
renderFaq();
</script>
</body>
</html>
